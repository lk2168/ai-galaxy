  sources: ["https://arxiv.org/abs/2204.02311"]

- id: lamda
  type: model
  name: LaMDA
  year: 2021
  weight: 68
  family: google
  summary: 专为对话训练的语言模型。一名工程师公开说它有感知，这件事后来变成了 AI 伦理讨论的经典案例。
  tags: [模型, 对话]
  sources: ["https://arxiv.org/abs/2201.08239"]

- id: gemini-1-5
  type: model
  name: Gemini 1.5
  year: 2024
  weight: 82
  family: google
  summary: 用混合专家架构把上下文推到一百万 token，能一次吞下一整本书或一段长视频。
  tags: [模型, 长文本, 多模态]
  sources: ["https://arxiv.org/abs/2403.05530"]

- id: gemma
  type: model
  name: Gemma
  year: 2024
  weight: 74
  family: google
  summary: 谷歌放出的开放权重小模型，能在笔记本上跑。它是大公司第一次认真做「可下载」的模型。
  tags: [模型, 开源]
  sources: ["https://blog.google/technology/developers/gemma-open-models/"]

# ── Meta ──────────────────────────────────────────────────────────────
- id: llama-2
  type: model
  name: Llama 2
  year: 2023
  weight: 84
  family: meta
