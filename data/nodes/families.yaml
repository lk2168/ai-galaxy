- id: deepseek-v3-1
  type: model
  name: DeepSeek-V3.1
  year: 2025
  weight: 78
  family: deepseek
  summary: 把「思考模式」和「非思考模式」放进同一个模型，按需切换。混合推理成为那一年开源模型的标配。
  tags: [模型, 推理, 开源]
  sources: ["https://api-docs.deepseek.com/news/news250821"]

