  year: 2024
  weight: 84
  family: meta
  summary: 用十五万亿 token 训练，开源模型第一次在通用能力上逼近闭源第一梯队。
  tags: [模型, 开源, 大模型]
  sources: ["https://ai.meta.com/blog/meta-llama-3/"]

- id: sam
  type: model
  name: Segment Anything
  year: 2023
  weight: 80
  family: meta
  summary: 点一下就能把图里的任何东西抠出来，十亿张掩码训出来的通用分割模型。视觉领域的基础设施。
  tags: [模型, 视觉, 开源]
  sources: ["https://arxiv.org/abs/2304.02643"]

# ── DeepSeek ──────────────────────────────────────────────────────────
- id: deepseek-coder
  type: model
  name: DeepSeek-Coder
  year: 2023
  weight: 70
  family: deepseek
  summary: 深度求索最早打出名声的一批代码模型，开放权重、支持长上下文，被大量本地编程助手采用。
