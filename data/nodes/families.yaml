# 模型家族：每个家族在主星系外侧自成一个卫星星团
# family 字段决定它挂在哪颗星团上；界面里每个家族是一团自己的星云

# ── OpenAI ────────────────────────────────────────────────────────────
- id: gpt-4o
  type: model
  name: GPT-4o
  year: 2024
  weight: 90
  family: openai
  summary: 把文本、图像、语音放进同一个模型里，语音对话延迟降到接近真人。openai 第一次把「实时」当卖点。
  tags: [模型, 多模态, 大模型]
  sources: ["https://openai.com/index/hello-gpt-4o/"]

- id: o3
  type: model
  name: OpenAI o3
  year: 2025
  weight: 82
  family: openai
  summary: 在数学与编程竞赛题上把分数推到接近满分，代价是单次回答可能要花掉大量推理算力。
  tags: [模型, 推理]
  sources: ["https://openai.com/index/introducing-o3-and-o4-mini/"]

- id: whisper
  type: model
  name: Whisper
  year: 2022
  weight: 78
  family: openai
  summary: 用六十八万小时的多语种音频训练，开源权重。它让「本地跑一个很好的语音识别」第一次变得普通。
  tags: [模型, 语音, 开源]
  sources: ["https://arxiv.org/abs/2212.04356"]

- id: codex
  type: model
  name: Codex
  year: 2021
  weight: 80
  family: openai
  summary: GitHub Copilot 背后的模型。它把「写代码时有人补全」变成了一件理所当然的事。
  tags: [模型, 代码]
  sources: ["https://arxiv.org/abs/2107.03374"]

# ── Anthropic ─────────────────────────────────────────────────────────
- id: claude-2
  type: model
  name: Claude 2
  year: 2023
  weight: 74
  family: anthropic
  summary: 把上下文拉到十万 token，能一次读完几百页文档。长文本从此成了 Anthropic 的招牌。
  tags: [模型, 长文本]
  sources: ["https://www.anthropic.com/news/claude-2"]

- id: claude-3
  type: model
  name: Claude 3
  year: 2024
  weight: 84
  family: anthropic
  summary: 一次发布三档模型（Haiku / Sonnet / Opus），第一次在部分测试上超过 GPT-4。多档位成为行业惯例。
  tags: [模型, 多模态]
  sources: ["https://www.anthropic.com/news/claude-3-family"]

- id: claude-3-5-sonnet
  type: model
  name: Claude 3.5 Sonnet
  year: 2024
  weight: 86
  family: anthropic
  summary: 编程能力被大量开发者认可，成了那一年写代码最常用的模型之一。它让 Anthropic 从「第二选择」变成主力。
  tags: [模型, 编程]
  sources: ["https://www.anthropic.com/news/claude-3-5-sonnet"]

- id: claude-4
  type: model
  name: Claude 4
  year: 2025
  weight: 84
  family: anthropic
  summary: 把重点放在长任务的连续执行上，能自己跑几小时的 agent 工作流，这是它与其他模型拉开差距的地方。
  tags: [模型, 智能体]
  sources: ["https://www.anthropic.com/news/claude-4"]

- id: constitutional-ai
  type: paper
  name: 宪法式 AI
  year: 2022
  weight: 76
  family: anthropic
  summary: 不靠大量人工标注，而是给模型一份写下来的原则，让它自己批评自己。这是与 RLHF 并行的另一条对齐路线。
  tags: [论文, 对齐]
  sources: ["https://arxiv.org/abs/2212.08073"]

# ── Google ────────────────────────────────────────────────────────────
- id: t5
  type: model
  name: T5
  year: 2019
  weight: 78
  family: google
  summary: 把所有自然语言任务都改写成「文本到文本」，一套框架通吃翻译、摘要、问答。
  tags: [模型, 语言]
  sources: ["https://arxiv.org/abs/1910.10683"]

- id: palm
  type: model
  name: PaLM
  year: 2022
  weight: 76
  family: google
  summary: 五千四百亿参数的密集模型，第一次在训练规模上压过同时期的 OpenAI。它证明谷歌的算力是真的多。
