# 全球模型家族（第二辑）：美国、中国、欧洲与其他地区
# 小到只有两个模型的家族也单独成团——它们各自代表一个国家或一家公司的押注

# ══ 美国 ══════════════════════════════════════════════════════════════

# —— Microsoft Phi：用小模型打大模型的路线 ——
- id: phi-1
  type: model
  name: Phi-1
  year: 2023
  weight: 70
  family: microsoft
  summary: 十三亿参数，专攻代码。用教科书级的高质量合成数据训练，证明了数据质量可以替代一部分参数量。
  tags: [模型, 小模型, 代码]
  sources: ["https://arxiv.org/abs/2306.11644"]

- id: phi-3
  type: model
  name: Phi-3
  year: 2024
  weight: 72
  family: microsoft
  summary: 三十八亿参数，在手机上就能跑，多项测试接近十倍大的模型。端侧模型从这时开始被认为真的可用。
  tags: [模型, 小模型, 端侧]
  sources: ["https://arxiv.org/abs/2404.14219"]

- id: phi-4
  type: model
  name: Phi-4
  year: 2024
  weight: 70
  family: microsoft
  summary: 一百四十亿参数，重点放在数学推理上。微软用它说明：小模型不必只是大模型的廉价替代品。
  tags: [模型, 小模型, 推理]
  sources: ["https://arxiv.org/abs/2412.08905"]

# —— NVIDIA：把算力卖成模型 ——
- id: nemotron-4
  type: model
  name: Nemotron-4
  year: 2024
  weight: 68
  family: nvidia
  summary: 英伟达自己训练的模型，主要用途是生成合成数据。卖铲子的人开始顺手卖原料。
  tags: [模型, 数据]
  sources: ["https://arxiv.org/abs/2406.11704"]

# —— Amazon ——
- id: titan
  type: model
  name: Amazon Titan
  year: 2023
  weight: 64
  family: amazon
  summary: AWS 的自研模型，藏在 Bedrock 里按调用收费。它的价值不在能力，在于让企业客户不用自己运维。
  tags: [模型, 云服务]
  sources: ["https://aws.amazon.com/bedrock/titan/"]

- id: nova
  type: model
  name: Amazon Nova
  year: 2024
  weight: 64
  family: amazon
  summary: 一整套多模态模型，从纯文本到视频生成都有。亚马逊第一次把模型做成完整的产品线。
  tags: [模型, 多模态]
  sources: ["https://aws.amazon.com/ai/generative-ai/nova/"]

# —— Cohere（加拿大起家）——
- id: command-r
  type: model
  name: Command R
  year: 2024
  weight: 66
  family: cohere
  summary: 主打企业检索增强（RAG）与工具调用，上下文拉到十二万八。它不做通用聊天，只做企业落地。
  tags: [模型, 企业, 检索]
  sources: ["https://cohere.com/command"]

# —— AI21（以色列）——
- id: jamba
  type: model
  name: Jamba
  year: 2024
  weight: 68
  family: ai21
  summary: 把 Transformer 和状态空间模型混在一起，上下文能到二十五万。架构混合是它最大的卖点。
  tags: [模型, 架构]
  sources: ["https://arxiv.org/abs/2403.19887"]

# —— Inflection ——
- id: pi
  type: model
  name: Pi
  year: 2023
  weight: 62
  family: inflection
  summary: 主打情绪陪伴的对话模型。它证明模型可以卖「性格」而不是卖跑分，但商业上没能撑住。
  tags: [模型, 对话]
  sources: ["https://inflection.ai/"]

# —— Allen AI ——
- id: olmo
  type: model
  name: OLMo
  year: 2024
  weight: 70
  family: allenai
  summary: 完全开放：权重、训练数据、训练代码、日志全部公开。它是研究「模型到底怎么学会的」的底本。
  tags: [模型, 开源, 研究]
  sources: ["https://arxiv.org/abs/2402.00838"]

# —— EleutherAI ——
- id: pythia
  type: model
  name: Pythia
  year: 2023
  weight: 66
  family: eleuther
  summary: 一整套同数据、同顺序、只改规模的小模型，专门用来研究训练过程。做可解释性研究的人几乎都用它。
  tags: [模型, 开源, 研究]
  sources: ["https://arxiv.org/abs/2304.01373"]

# —— Runway ——
- id: gen-3
  type: model
  name: Gen-3 Alpha
  year: 2024
  weight: 68
  family: runway
  summary: 面向影视制作的视频生成模型，强调镜头运动与一致性。它把 AI 视频从演示推到了能用。
  tags: [模型, 视频, 生成]
  sources: ["https://runwayml.com/research/introducing-gen-3-alpha"]

